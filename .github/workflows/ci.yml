name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Tests (small CI geography)
        run: INCRLAB_SMALL=1 pytest -q
      - name: Module tests on the full geography (Social, Paid Search; ~2 min)
        run: |
          python -m incrlab.simulate
          pytest -q tests/test_meta.py tests/test_search.py tests/test_pipeline.py
