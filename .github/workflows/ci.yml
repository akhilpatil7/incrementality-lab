name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INCRLAB_SMALL: "1"
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Tests (small geography)
        run: INCRLAB_SMALL=1 pytest -q
      - name: Pipeline smoke (small geography, data + summary)
        run: |
          INCRLAB_SMALL=1 python -m incrlab.simulate --small --out "$RUNNER_TEMP/incrlab_data"
          python -m incrlab.pipeline readme-table > /dev/null
